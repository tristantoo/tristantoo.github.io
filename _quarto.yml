project:
  type: website
  output-dir: _site
  post-render: scripts/post_render.py
  resources:
    - CNAME
    - styles/tokens.css
    - styles/base.css
    - hospital-prices/**
    - pfas-michigan/**

website:
  title: "Tristan Kennedy"
  site-url: https://tristkenn.com
  description: "Statistics PhD student at Virginia Commonwealth University."
  repo-url: https://github.com/tristantoo/tristantoo.github.io

# minimal: no Bootstrap. Nav and footer come from _includes; styles/site.css imports the Hallmark tokens and base.
format:
  html:
    minimal: true
    template-partials:
      - _includes/styles.html
    css: styles/site.css
    include-in-header: _includes/head.html
    include-before-body: _includes/nav.html
    include-after-body: _includes/footer.html
